[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave-registry"
version = "0.1.0"
description = "SciWeave registry facts and MCP service"
requires-python = ">=3.11"
dependencies = ["sciweave-audit-trail"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv.sources]
sciweave-audit-trail = { path = "../shared/audit-trail", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
