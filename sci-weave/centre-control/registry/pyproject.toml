[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave-registry"
version = "0.1.0"
description = "SciWeave registry facts and MCP service"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "sciweave-audit-trail",
    "starlette>=0.27,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "uvicorn>=0.30,<1",
]

[tool.uv.sources]
sciweave-audit-trail = { path = "../shared/audit-trail", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
