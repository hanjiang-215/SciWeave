[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave-task-agent-gateway-subscriber"
version = "0.1.0"
description = "SciWeave Task Agent queue subscriber role"
requires-python = ">=3.12,<3.16"
dependencies = [
    "sciweave-task-agent-worker",
    "kafka-python>=3.0.11,<4",
]

[project.scripts]
sciweave-task-agent-gateway-subscriber = "gateway_subscriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sciweave-task-agent-worker = { workspace = true, editable = true }