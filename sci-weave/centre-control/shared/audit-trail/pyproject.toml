[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave-audit-trail"
version = "0.1.0"
description = "SciWeave append-only audit trail shared package"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audit_trail = ["*.sql"]
