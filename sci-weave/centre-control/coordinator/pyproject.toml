[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave-coordinator"
version = "0.1.0"
description = "SciWeave handoff coordinator core: dependency recomputation, waiting facts and dispatch recovery"
requires-python = ">=3.11"
dependencies = [
    "kafka-python>=3.0.11,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
