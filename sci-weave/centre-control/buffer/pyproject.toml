[project]
name = "sciweave-draft-buffer"
version = "0.1.0"
description = "Human-reviewed draft buffer for Research Mapping and LLM-Wiki"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sciweave-draft-buffer = "draft_buffer.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "draft_buffer"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
