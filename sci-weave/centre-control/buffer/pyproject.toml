[project]
name = "sciweave-draft-buffer"
version = "0.1.0"
description = "Human-reviewed draft buffer for Research Mapping and LLM-Wiki"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sciweave-draft-buffer = "draft_buffer.main:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
