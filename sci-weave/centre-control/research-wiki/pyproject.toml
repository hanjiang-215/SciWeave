[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave-llm-wiki"
version = "0.1.0"
description = "SciWeave LLM-Wiki resource review slice"
requires-python = ">=3.11"
dependencies = [
    "sciweave-audit-trail",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sciweave-audit-trail = { path = "../shared/audit-trail" }
