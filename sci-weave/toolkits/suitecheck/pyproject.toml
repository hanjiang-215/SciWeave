[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave-suitecheck"
version = "0.1.0"
description = "Validate SciWeave Agent suite manifests and their declared payloads"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0,<7"]

[project.scripts]
suitecheck = "suitecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
