[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "sciweave-work-agent-runtime"
version = "0.1.0"
description = "Independent runtime libraries for a researcher-owned Work Agent"
requires-python = ">=3.12,<3.16"
dependencies = [
    "pyyaml>=6.0,<7",
    "kafka-python>=3.0.11,<4",
    "fast-agent-mcp>=0.10.46,<0.11",
]

[tool.uv.build-backend]
module-name = "work_agent_runtime"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
