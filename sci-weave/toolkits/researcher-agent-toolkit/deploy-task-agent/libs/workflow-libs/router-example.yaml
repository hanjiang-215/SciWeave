# Router example. Agent names carry a file-level prefix because the loader merges
# every YAML file in the directory into one namespace: an unprefixed `writer` here
# collides with the `writer` in the other three examples and the whole directory
# fails to load with [duplicate_definition].
version: 1.0.0
name: router-workflows
agents:
  router: {identity: task router, instruction: route the task, model: configure-locally, allowed_mcp_resources: [], resources: []}
  router-searcher: {identity: evidence searcher, instruction: find evidence, model: configure-locally, allowed_mcp_resources: [research-mapping], resources: []}
  router-writer: {identity: final writer, instruction: write one draft, model: configure-locally, allowed_mcp_resources: [draft-buffer], resources: []}
workflows:
  router-example: {type: Router, entry_agent: router, sub_agents: [router-searcher], summarizer: router, final_writer: router-writer}
