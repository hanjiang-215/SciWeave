; ---------------------------------------------------------------- 中央 Agent
[program:centre-gateway-mcp]
command=/opt/venvs/centre-agents/bin/sciweave-task-agent-gateway-mcp
directory=/app/centre-agents
priority=160
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=20
; Worker 是 gateway 用 multiprocessing spawn 出来的子进程，停进程组才能一并收掉。
stopasgroup=true
killasgroup=true

[program:centre-gateway-subscriber]
