; 中央服务单容器内的进程管理配置。
;
; 一个容器里跑 12 个角色，全部由 supervisord 托管：进程按优先级启动、异常退出后
; 自动重启、`supervisorctl` 可以单独 restart/stop 某个角色、日志统一走容器
; stdout/stderr。
;
; 约定：
; - 端口、地址、令牌、路径全部来自环境变量（compose.yaml 的 environment +
;   env_file）。这里只写“同一份环境里必须因角色而异”的少量覆盖项，其余继承容器
;   环境，避免同一份变量被 12 个进程按各自的解析规则误读。
; - research-map / research-wiki 的 `src/main.py` 是四选一的单进程入口
;   （看板模式 > MCP 模式 > 一次性 stdout），同一进程不能同时提供看板和 MCP，
;   所以各拆成两个 program，并用 *_DASHBOARD_MODE 区分。
; - registry 与 email-service 都必填 SCIWEAVE_AUDIT_SQLITE_PATH，同容器内必须
;   指向不同文件，因此在这里按 program 覆盖。

[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
; 监督器自己的事件也进容器 stdout：进程反复重启时，先看到的应该是 restart 记录，
; 而不是一条被丢掉的日志。
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------- 领域治理面
[program:mapping-mcp]
command=/opt/venvs/research-map/bin/python src/main.py
directory=/app/research-map
priority=120
environment=SCIWEAVE_MAPPING_DASHBOARD_MODE="0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=15

[program:mapping-dashboard]
command=/opt/venvs/research-map/bin/python src/main.py
directory=/app/research-map
priority=140
environment=SCIWEAVE_MAPPING_DASHBOARD_MODE="1"
