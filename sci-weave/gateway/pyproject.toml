[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sciweave-gateway"
version = "0.1.0"
description = "SciWeave Gateway MVP"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sciweave-gateway = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
